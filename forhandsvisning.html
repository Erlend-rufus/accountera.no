<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#efece6" />
    <title>Forhåndsvisning – designidéer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Kun for /forhandsvisning. Egne klassenavn (byq-*), ingenting her overlapper med site.css,
         så denne blokken kan aldri påvirke andre sider selv om cssCodeSplit er av. */
      .byq-banner {
        background: var(--acc-navy);
        color: var(--acc-cream);
        font-size: var(--acc-fs-small);
        text-align: center;
        padding: 0.625rem 1rem;
      }
      .byq-banner strong { font-weight: var(--acc-w-medium); }

      /* Idé 1: forbindelseslinje i "Slik fungerer det" */
      @media (min-width: 960px) {
        .byq-how__grid { position: relative; }
        .byq-how__grid::before {
          content: '';
          position: absolute;
          top: 0.85rem;
          left: calc(100% / 6);
          right: calc(100% / 6);
          height: 1px;
          background: var(--acc-cream-a30);
        }
        .byq-how__step { border-top: none; padding-top: 2.25rem; position: relative; }
        .byq-how__step::before {
          content: '';
          position: absolute;
          top: 0.6rem;
          left: 0;
          width: 9px;
          height: 9px;
          border-radius: 50%;
          background: var(--acc-cream);
        }
      }

      /* Idé 2: tynnere, mer «hovedbok»-preget skille i bevislisten.
         Sammensatt selektor (.proof__facts.byq-proof-facts) for å slå den delte
         .proof__facts li-regelen uansett rekkefølge på <link>/<style> i <head>. */
      .proof__facts.byq-proof-facts li {
        border-top: 1px solid rgba(19, 60, 98, 0.14);
        padding: 0.625rem 0;
      }
      .proof__facts.byq-proof-facts li:last-child {
        border-bottom-color: rgba(19, 60, 98, 0.14);
      }

      /* Idé 3: sitattegn som dekorativt glyf */
      .byq-quote { position: relative; padding-left: 1.5rem; }
      .byq-quote::before {
        content: '”';
        position: absolute;
        left: -0.35rem;
        top: -0.9rem;
        font-size: 3.5rem;
        line-height: 1;
        font-weight: var(--acc-w-medium);
        color: var(--acc-primary);
        opacity: 0.28;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/forhandsvisning/main.tsx"></script>
  </body>
</html>
